# =====================================================================
# ChunkGenerator
#
# Defaults below work for most Paper hosts. The plugin auto-scales its
# internal chunk queue from your CPU cores and JVM heap, so you do not
# need to touch the advanced section to get a working pre-generator.
#
# > To actually generate FASTER, the real lever is Paper itself, not
# > this plugin. Open config/paper-global.yml in your server root and
# > raise the chunk worker count:
# >
# >     chunk-system:
# >       worker-threads: <cores - 1>   # e.g. 5 on a 6-core host
# >       io-threads:     3
# >
# > The default value -1 is "auto" (~cores/2), which leaves most of
# > the CPU idle during pre-generation. The plugin will print the
# > exact number it recommends for your host in the startup log.
# =====================================================================


# === Basics ===

# Target server TPS. Lower (e.g. 15) on shared hardware, raise toward
# 20 on a dedicated pre-generation host.
target-tps: 18.5

# Live BossBar for staff with the chunkgenerator.bossbar permission.
# Colors: PINK, BLUE, RED, GREEN, YELLOW, PURPLE, WHITE.
bossbar:
  enabled: true
  color: BLUE

# Compact ActionBar for the player who launched the job.
actionbar: true

# Periodic progress log to the server console.
console:
  enabled: true
  interval-seconds: 30

# Resume any job that was running when the server stopped.
auto-resume: true


# === Advanced ===
# Leave the section below alone unless you know what you are doing.

throttle:
  # Auto-derive max-inflight and start-inflight from CPU cores and
  # heap. Set explicit non-zero values below to override.
  auto-scale: true
  max-inflight: 0
  min-inflight: 8
  start-inflight: 0
  # Memory thresholds (% of max heap). Lower (e.g. 60 / 70) on
  # container hosts running with MaxRAMPercentage=95 - see README.
  memory-backoff-pct: 70
  memory-pause-pct: 80

monitoring-poll-ms: 1000
save-throttle-seconds: 5
save-throttle-chunks: 1000
