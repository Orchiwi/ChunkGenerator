# =====================================================================
# ChunkGenerator messages
#
# Color codes use the standard '&' prefix (translated to section signs
# at runtime). Available placeholders are documented next to each key.
# =====================================================================

prefix: "&8[&bChunkGenerator&8] &r"

command:
  no-permission: "&cYou do not have permission to run this command."
  player-or-console: "&cThis command is only usable in-game or from the console."
  unknown-subcommand: "&cUnknown subcommand. Try &e/{label} help&c."
  reload-success: "&aChunkGenerator configuration reloaded."
  reload-failed: "&cReload failed: &7{error}"

  start:
    usage: "&cUsage: &e/{label} start <world> <square|circle|rectangle> <size> [centerX centerZ]"
    usage-rectangle: "&cUsage for rectangle: &e/{label} start <world> rectangle <halfWidth> <halfLength> [centerX centerZ]"
    unknown-world: "&cUnknown world: &e{world}"
    unknown-shape: "&cUnknown shape &e{shape}&c. Use square, circle or rectangle."
    invalid-size: "&cInvalid size: &e{value}"
    invalid-coords: "&cInvalid coordinates."
    already-running: "&cA job is already running for world &e{world}&c. Use &e/{label} cancel {world}&c first."
    size-too-large: "&cSize too large (max {max} blocks)."
    started: "&aStarted job for &e{world}&a: shape &e{shape}&a, size &e{size}&a, center &e({centerX},{centerZ})&a, target &e{total}&a chunks."

  stop:
    usage: "&cUsage: &e/{label} stop <world>"
    not-running: "&7No active job for world &e{world}&7."
    stopped: "&eJob for &e{world}&e paused."

  cancel:
    usage: "&cUsage: &e/{label} cancel <world>"
    no-job: "&7No job to cancel for world &e{world}&7."
    cancelled: "&eJob for &e{world}&e cancelled and state file removed."

  status:
    no-job: "&7No job for world &e{world}&7."
    no-jobs: "&7No jobs registered."
    header: "&8&m            &r &bChunkGenerator status &8&m            "
    line-world: "&8│ &7World: &f{world}"
    line-state: "&8│ &7State: &f{state}"
    line-shape: "&8│ &7Shape: &f{shape} &7| Center: &f({centerX},{centerZ}) &7| Size: &f{sizeX}x{sizeZ}"
    line-progress: "&8│ &7Progress: &a{percent}% &7({done}/{total} chunks)"
    line-speed: "&8│ &7Speed: &b{speed} chunk/s &7| ETA: &e{eta}"
    line-perf: "&8│ &7TPS: &f{tps} &7| CPU: &f{cpu}% &7| RAM: &f{ram} MB &7| Inflight: &f{inflight}/{target}"

  list:
    empty: "&7No jobs registered."
    header: "&8&m            &r &bChunkGenerator jobs &8&m            "
    entry: "&8- &f{world} &7({state}) &7- &a{percent}% &7- &b{speed} chunk/s"

  help:
    header: "&8&m            &r &bChunkGenerator commands &8&m            "
    start: "&e/{label} start <world> <shape> <size> &8- &7Start a pre-generation job"
    stop: "&e/{label} stop <world> &8- &7Pause a job (state preserved)"
    cancel: "&e/{label} cancel <world> &8- &7Cancel and discard a job"
    status: "&e/{label} status [world] &8- &7Show job snapshot"
    list: "&e/{label} list &8- &7List all jobs"
    reload: "&e/{label} reload &8- &7Reload the configuration"

display:
  bossbar: "&b{world} &8| &a{percent}% &8| &b{speed} chunk/s &8| &eETA {eta}"
  actionbar: "&a{percent}% &8| &b{speed} chunk/s &8| &eETA {eta}"
  console: "[{world}] {percent}% - {done}/{total} chunks - {speed} chunk/s - inflight {inflight}/{target} - TPS {tps} - CPU {cpu}% - RAM {ram} MB"
